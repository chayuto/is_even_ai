name: Release

# Publishes to RubyGems.org via Trusted Publishing (OIDC). No API key is stored in GitHub.
# One-time setup on rubygems.org: Gem > Trusted Publishers > GitHub Actions
#   repository: chayuto/is_even_ai, workflow: release.yml, environment: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify the tag matches lib/is_even_ai/version.rb
        run: |
          version="$(ruby -Ilib -e 'require "is_even_ai/version"; puts IsEvenAI::VERSION')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version v${version}" >&2
            exit 1
          fi
      - name: Test
        run: bundle exec rake
      - uses: rubygems/release-gem@v1
