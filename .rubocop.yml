plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# Keyword arguments are the idiomatic way to take many options in Ruby.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The gem is named after its module on purpose: IsEvenAI, is_even_ai.
Naming/FileName:
  Exclude:
    - "lib/is_even_ai.rb"

# `even?` / `odd?` are the whole point; `n % 2 == 0` appears in the benchmark deliberately.
Style/NumericPredicate:
  Enabled: false
Style/MultipleComparison:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/NestedGroups:
  Max: 4
RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/ContextWording:
  Enabled: false
RSpec/StubbedMock:
  Enabled: false
RSpec/MessageSpies:
  Enabled: false
RSpec/ExpectInHook:
  Enabled: false
